<!DOCTYPE html>
<html>
<head>
  <title>Battery System</title>
</head>

<body>

  <h1>Battery Dashboard</h1>

  <!-- NAVIGATION -->
  <div style="margin-bottom:30px">
    <button onclick="showPage('main')">Main</button>
    <button onclick="showPage('storage')">Storage</button>
    <button onclick="showPage('processing')">Processing</button>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('admin')">Admin</button>
  </div>

  <!-- MAIN -->
  <div id="mainPage">
    <h2>Main</h2>
    <p>Welcome to Battery System</p>
  </div>

  <!-- STORAGE -->
  <div id="storagePage" style="display:none">
    <h2>Storage</h2>

    <h3>Add batteries to storage optimization</h3>

    <input id="barcode" placeholder="Barcode" />

    <select id="batteryType"></select>

    <select id="classification">
      <option value="STABLE">STABLE</option>
      <option value="CRITICAL">CRITICAL</option>
    </select>

    <button onclick="addBattery()">Add to queue</button>

    <ul id="batteryList"></ul>

    <button onclick="bulkInsert()">Bulk</button>

    <!-- INSERTED -->
    <h3>Inserted Batteries (not yet stored)</h3>
    <table border="1" id="insertedTable">
      <thead>
        <tr>
          <th>Barcode</th>
          <th>Type</th>
          <th>Chemistry</th>
          <th>Classification</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <br>
    <button onclick="optimize()">Optimize Storage</button>

    <hr>

    <!-- STORAGE + PLACEMENT -->
    <div style="display:flex; gap:40px; align-items:flex-start;">

      <div>
        <h3>Storage Overview</h3>
        <div id="storageView"></div>
      </div>

      <div>
        <h3>Placement Result</h3>
        <div id="placementView"></div>
      </div>

    </div>

    <button onclick="load()">Refresh</button>

  </div>

  <div id="processingPage" style="display:none"></div>
  <div id="dashboardPage" style="display:none"></div>
  <div id="adminPage" style="display:none"></div>

<script>

const BASE = "https://battbatt-1.onrender.com/api";

let queue = [];
let lastInsertedBarcodes = []; // 🔥 TÄRKEÄ
let batteryTypes = {};

// 🔥 LISÄÄ TÄMÄ TÄHÄN
async function loadBatteryTypes() {

  const res = await fetch(`${BASE}/batteries/types`);
  const data = await res.json();

  const select = document.getElementById("batteryType");
  select.innerHTML = "";

  batteryTypes = {};

  data.forEach(t => {
    batteryTypes[t.id] = t.name;

    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.name;

    select.appendChild(opt);
  });
}

/* =========================
   ADD BATTERY
========================= */
function addBattery() {
  const barcode = document.getElementById("barcode").value;
  const typeId = document.getElementById("batteryType").value;
  const classification = document.getElementById("classification").value;

  if (!barcode) {
    alert("Barcode missing");
    return;
  }

  queue.push({
    barcode: barcode,
    batteryType: { id: parseInt(typeId) },
    classification: classification
  });

  renderQueue();
}

/* =========================
   RENDER QUEUE
========================= */
function renderQueue() {
  const list = document.getElementById("batteryList");
  list.innerHTML = "";

  queue.forEach(b => {
    const li = document.createElement("li");

    const typeName = batteryTypes[b.batteryType.id] || "Unknown";

    li.innerText = `${b.barcode} | ${typeName} | ${b.classification}`;

    list.appendChild(li);
  });
}

/* =========================
   BULK INSERT
========================= */
async function bulkInsert() {

  if (queue.length === 0) {
    alert("Queue empty");
    return;
  }

  const res = await fetch(`${BASE}/batteries/bulk`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(queue)
  });

  const data = await res.json();

  // 🔥 TALLENNA UUSIEN BARCODET
  lastInsertedBarcodes = data.map(b => b.barcode);

  queue = [];
  renderQueue();

  loadInserted();
}

/* =========================
   LOAD INSERTED
========================= */
async function loadInserted() {

  const res = await fetch(`${BASE}/batteries`);
  const data = await res.json();

  const tbody = document.querySelector("#insertedTable tbody");
  tbody.innerHTML = "";

  data.forEach(b => {
    if (!b.storageSlot) {
      const row = `
        <tr>
          <td>${b.barcode}</td>
          <td>${b.batteryType.name}</td>
          <td>${b.batteryType.chemistry}</td>
          <td>${b.classification}</td>
        </tr>
      `;
      tbody.innerHTML += row;
    }
  });
}

/* =========================
   OPTIMIZE
========================= */
async function optimize() {

  const container = document.getElementById("storageView");
  container.innerHTML = "<p style='color:orange;'>Refresh to show updated lists...</p>";

  await fetch(`${BASE}/optimize`, { method: "POST" });

  queue = [];
  renderQueue();

  // 🔥 useampi refresh
  setTimeout(load, 800);
  setTimeout(load, 1500);
  setTimeout(load, 2200);
}

/* =========================
   LOAD STORAGE + PLACEMENT
========================= */
async function load() {

  const res = await fetch(`${BASE}/batteries/summary`);
  const data = await res.json();

  const container = document.getElementById("storageView");
  container.innerHTML = "";

  const grouped = {};

  // 🔥 lookup LISTA (EI object overwritea!)
  const slotLookup = [];

  data.forEach(item => {
    if (!grouped[item.storageName]) {
      grouped[item.storageName] = [];
    }
    grouped[item.storageName].push(item);

    // 🔥 kerätään mapping talteen
    slotLookup.push({
      slotName: item.slotName,
      storageName: item.storageName,
      chemistry: item.chemistry
    });
  });

  // =========================
  // STORAGE VIEW
  // =========================
  for (const storage in grouped) {

    let html = `<h3>${storage}</h3>`;

    grouped[storage].forEach(slot => {
      html += `
        <div>
          → Shelf ${slot.slotName} 
          <span style="color:gray;">
          (${storage}, ${slot.batteryCount} pcs, ${slot.utilization}%)
          </span>
        </div>
      `;
    });

    const div = document.createElement("div");
    div.innerHTML = html;
    container.appendChild(div);
  }

  // =========================
  // 🔥 PLACEMENT RESULT FIX
  // =========================
  const resAll = await fetch(`${BASE}/batteries`);
  const all = await resAll.json();

  const placementContainer = document.getElementById("placementView");
  placementContainer.innerHTML = "";

  const placed = all.filter(b =>
    lastInsertedBarcodes.includes(b.barcode)
  );

  if (placed.length === 0) {
    placementContainer.innerHTML = "<p>No recent placements</p>";
    return;
  }

  placed.forEach(b => {

    // 🔥 FIND oikea storage summarysta
    const match = slotLookup.find(s =>
      s.slotName === b.storageSlot?.name &&
      s.chemistry === b.batteryType?.chemistry
    );

    const storageName = match ? match.storageName : "Storage";

    const div = document.createElement("div");

    div.innerHTML = `
       <span style="display:inline-block; width:250px;">
        ${b.barcode}<br>
        <small>
       ${b.batteryType?.name} | ${b.classification}
        </small>
         </span>
      → 
      <span style="color:${b.storageSlot ? 'green' : 'orange'};">
        ${
          b.storageSlot
            ? storageName + " – Shelf " + b.storageSlot.name
            : "Placing..."
        }
      </span>
    `;

    placementContainer.appendChild(div);
  });
}

/* =========================
   NAVIGATION
========================= */
function showPage(page) {

  const pages = ["mainPage", "storagePage", "processingPage", "dashboardPage", "adminPage"];

  pages.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });

  const active = document.getElementById(page + "Page");
  if (active) active.style.display = "block";
}

/* =========================
   INIT
========================= */
window.onload = async () => {
  await loadBatteryTypes(); // 🔥 tämä
  load();
  loadInserted();
};

</script>

</body>
</html>
