<!DOCTYPE html>
<html>
<head>
  <title>Battery System</title>
</head>

<body>

  <h1>Battery Dashboard</h1>

  <!-- NAVIGATION -->
  <div style="margin-bottom:30px">
    <button onclick="showPage('main')">Main</button>
    <button onclick="showPage('storage')">Storage</button>
    <button onclick="showPage('processing')">Processing</button>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('admin')">Admin</button>
  </div>

  <!-- MAIN -->
  <div id="mainPage">
    <h2>Main</h2>
    <p>Welcome to Battery System</p>
  </div>

  <!-- STORAGE -->
  <div id="storagePage" style="display:none">
    <h2>Storage</h2>

    <h3>Add batteries to storage optimization</h3>

    <input id="barcode" placeholder="Barcode" />

    <select id="batteryType">
      <option value="1">NMC Pack</option>
      <option value="2">NMC Pack 2</option>
      <option value="3">NMC Module</option>
      <option value="4">LFP Pack</option>
      <option value="5">LFP Pack 2</option>
      <option value="6">LFP Module</option>
    </select>

    <select id="classification">
      <option value="STABLE">STABLE</option>
      <option value="CRITICAL">CRITICAL</option>
    </select>

    <button onclick="addBattery()">Add to queue</button>

    <ul id="batteryList"></ul>

    <button onclick="bulkInsert()">Bulk</button>

    <!-- INSERTED -->
    <h3>Inserted Batteries (not yet stored)</h3>
    <table border="1" id="insertedTable">
      <thead>
        <tr>
          <th>Barcode</th>
          <th>Type</th>
          <th>Chemistry</th>
          <th>Classification</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <br>
    <button onclick="optimize()">Optimize Storage</button>

    <hr>

    <!-- STORAGE VIEW -->
    <div style="display:flex; gap:40px; align-items:flex-start;">

  <!-- LEFT: STORAGE -->
   <div>
    <h3>Storage Overview</h3>
    <div id="storageView"></div>
  </div>

  <!-- RIGHT: PLACEMENT -->
  <div>
    <h3>Placement Result</h3>
    <div id="placementView"></div>
  </div>

</div>

    <button onclick="load()">Refresh</button>
    
  </div>

  <!-- 🔥 LISÄTTY TAKAS → estää crashin -->
  <div id="processingPage" style="display:none">
    <h2>Processing</h2>
  </div>

  <div id="dashboardPage" style="display:none">
    <h2>Dashboard</h2>
  </div>

  <div id="adminPage" style="display:none">
    <h2>Admin</h2>
  </div>

<script>

const BASE = "https://battbatt-1.onrender.com/api"; // 🔥 TÄMÄ LISÄTTY

let queue = [];

/* =========================
   ADD BATTERY
========================= */
function addBattery() {
  const barcode = document.getElementById("barcode").value;
  const typeId = document.getElementById("batteryType").value;
  const classification = document.getElementById("classification").value;

  if (!barcode) {
    alert("Barcode missing");
    return;
  }

  queue.push({
    barcode: barcode,
    batteryType: { id: parseInt(typeId) },
    classification: classification
  });

  renderQueue();
}

/* =========================
   RENDER QUEUE
========================= */
function renderQueue() {
  const list = document.getElementById("batteryList");
  list.innerHTML = "";

  queue.forEach(b => {
    const li = document.createElement("li");
    li.innerText = b.barcode;
    list.appendChild(li);
  });
}

/* =========================
   BULK INSERT
========================= */
async function bulkInsert() {

  if (queue.length === 0) {
    alert("Queue empty");
    return;
  }

  const res = await fetch(`${BASE}/batteries/bulk`, {  // 🔥 FIX
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(queue)
  });

  if (!res.ok) {
    const text = await res.text();
    alert("Bulk failed: " + text);
    return;
  }

  queue = [];
  renderQueue();

  loadInserted();
}

/* =========================
   LOAD INSERTED
========================= */
async function loadInserted() {

  const res = await fetch(`${BASE}/batteries`); // 🔥 FIX
  const data = await res.json();

  const tbody = document.querySelector("#insertedTable tbody");
  tbody.innerHTML = "";

  data.forEach(b => {

    if (!b.storageSlot) {

      const row = `
        <tr>
          <td>${b.barcode}</td>
          <td>${b.batteryType.name}</td>
          <td>${b.batteryType.chemistry}</td>
          <td>${b.classification}</td>
        </tr>
      `;
      tbody.innerHTML += row;
    }
  });
}

/* =========================
   OPTIMIZE
========================= */
async function optimize() {

  const container = document.getElementById("storageView");
  container.innerHTML = "<p style='color:orange;'>Refresh to see updated storage overview</p>";

  const res = await fetch(`${BASE}/optimize`, { method: "POST" });

  if (!res.ok) {
    alert("Optimize failed");
    return;
  }

  queue = [];
  renderQueue();

  // 🔥 tee useampi automaattinen refresh
  setTimeout(loadAll, 500);
  setTimeout(loadAll, 1000);
  setTimeout(loadAll, 1500);
  setTimeout(loadAll, 2000);
}

async function loadAll() {
  await load();
  await loadInserted();
  await loadPlacement();
}

/* =========================
   LOAD STORAGE SUMMARY + PLACEMENT
========================= */
async function load() {

  const res = await fetch(`${BASE}/batteries/summary`);
  const data = await res.json();

  // 🔥 STORAGE VIEW
  const container = document.getElementById("storageView");
  container.innerHTML = "";

  const grouped = {};

  data.forEach(item => {
    if (!grouped[item.storageName]) {
      grouped[item.storageName] = [];
    }
    grouped[item.storageName].push(item);
  });

  for (const storage in grouped) {

    const div = document.createElement("div");

    let html = `<h3>${storage}</h3>`;

    grouped[storage].forEach(slot => {
      html += `
        <div>
          → Shelf ${slot.slotName} 
          (${slot.batteryCount} pcs, ${slot.utilization}%)
        </div>
      `;
    });

    div.innerHTML = html;
    container.appendChild(div);
  }

  // ======================================
  // 🔥 PLACEMENT RESULT (UUSI OSA)
  // ======================================

  const placementContainer = document.getElementById("placementView");

  // jos elementtiä ei ole → älä kaadu
  if (!placementContainer) return;

    placementContainer.innerHTML = "<p>No recent placements</p>";

  }

  placed.forEach(b => {
    const div = document.createElement("div");

    div.innerHTML = `
      <span style="display:inline-block; width:140px;">
        ${b.barcode}
      </span>
      → 
      <span style="color:green;">
        ${b.storageSlot ? "Shelf " + b.storageSlot.name : "NOT PLACED"}

}

/* =========================
   NAVIGATION
========================= */
function showPage(page) {

  const pages = ["mainPage", "storagePage", "processingPage", "dashboardPage", "adminPage"];

  pages.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.style.display = "none";
    }
  });

  const active = document.getElementById(page + "Page");
  if (active) {
    active.style.display = "block";
  }
}

/* =========================
   AUTO LOAD
========================= */
window.onload = () => {
  load();
  loadInserted();
};

</script>

</body>
</html>
