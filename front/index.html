<!DOCTYPE html>
<html>
<head>
  <title>Battery System</title>
</head>

<body>

  <h1>Battery Dashboard</h1>

  <!-- NAVIGATION -->
  <div style="margin-bottom:30px">
    <button onclick="showPage('main')">Main</button>
    <button onclick="showPage('storage')">Storage</button>
    <button onclick="showPage('processing')">Processing</button>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('admin')">Admin</button>
  </div>

  <!-- MAIN -->
  <div id="mainPage">
    <h2>Main</h2>
    <p>Welcome to Battery System</p>
  </div>

  <!-- STORAGE -->
  <div id="storagePage" style="display:none">
    <h2>Storage</h2>

    <h3>Add batteries to storage optimization</h3>

    <input id="barcode" placeholder="Barcode" />

    <select id="batteryType">
      <option value="1">NMC Pack</option>
      <option value="2">NMC Pack 2</option>
      <option value="3">NMC Module</option>
      <option value="4">LFP Pack</option>
      <option value="5">LFP Pack 2</option>
      <option value="6">LFP Module</option>
    </select>

    <select id="classification">
      <option value="STABLE">STABLE</option>
      <option value="CRITICAL">CRITICAL</option>
    </select>

    <button onclick="addBattery()">Add to queue</button>

    <ul id="batteryList"></ul>

    <button onclick="bulkInsert()">Bulk</button>

    <!-- 🔥 INSERTED -->
    <h3>Inserted Batteries</h3>
    <table border="1" id="insertedTable">
      <thead>
        <tr>
          <th>Barcode</th>
          <th>Type</th>
          <th>Chemistry</th>
          <th>Classification</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- 🔥 OPTIMIZE TÄNNE -->
    <br>
    <button onclick="optimize()">Optimize Storage</button>

    <hr>

    <!-- 🔥 STORAGE VIEW -->
    <h3>Storage Overview</h3>
    <div id="storageView"></div>

    <button onclick="load()">Refresh</button>

  </div>

  <!-- PROCESSING -->
  <div id="processingPage" style="display:none">
    <h2>Processing</h2>

    <button onclick="optimizeProcessing()">Optimize Processing</button>
    <button onclick="confirmProcessing()">Confirm Processing</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardPage" style="display:none">
    <h2>Dashboard</h2>

    <h3>Worker Summary</h3>
    <table border="1" id="workers">
      <tbody></tbody>
    </table>

    <h3>Device Summary</h3>
    <table border="1" id="devices">
      <tbody></tbody>
    </table>
  </div>

  <!-- ADMIN -->
  <div id="adminPage" style="display:none">
    <h2>Admin</h2>
    <button>Add battery type</button>
    <button>Add storage</button>
  </div>

<script>

let queue = [];

/* =========================
   ADD BATTERY
========================= */
function addBattery() {
  const barcode = document.getElementById("barcode").value;
  const typeId = document.getElementById("batteryType").value;
  const classification = document.getElementById("classification").value;

  queue.push({
    barcode: barcode,
    batteryType: { id: parseInt(typeId) },
    classification: classification
  });

  renderQueue();
}

/* =========================
   RENDER QUEUE
========================= */
function renderQueue() {
  const list = document.getElementById("batteryList");
  list.innerHTML = "";

  queue.forEach(b => {
    const li = document.createElement("li");
    li.innerText = b.barcode;
    list.appendChild(li);
  });
}

/* =========================
   BULK INSERT
========================= */
async function bulkInsert() {

  await fetch("/api/batteries/bulk", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(queue)
  });

  queue = [];
  renderQueue();

  loadInserted();
}

/* =========================
   LOAD INSERTED
========================= */
async function loadInserted() {

  const res = await fetch("/api/batteries");
  const data = await res.json();

  const tbody = document.querySelector("#insertedTable tbody");
  tbody.innerHTML = "";

  data.forEach(b => {
    if (!b.storageSlot) {
      const row = `
        <tr>
          <td>${b.barcode}</td>
          <td>${b.batteryType.name}</td>
          <td>${b.batteryType.chemistry}</td>
          <td>${b.classification}</td>
        </tr>
      `;
      tbody.innerHTML += row;
    }
  });
}

/* =========================
   OPTIMIZE
========================= */
async function optimize() {

  await fetch("/api/optimize", { method: "POST" });

  // 🔥 tyhjennä inserted table
  document.querySelector("#insertedTable tbody").innerHTML = "";

  // 🔥 päivitä näkymä
  load();
}

/* =========================
   LOAD STORAGE SUMMARY
========================= */
async function load() {

  const res = await fetch("/api/batteries/summary");
  const data = await res.json();

  const container = document.getElementById("storageView");
  container.innerHTML = "";

  // 🔥 group by storage
  const grouped = {};

  data.forEach(item => {
    if (!grouped[item.storageName]) {
      grouped[item.storageName] = [];
    }
    grouped[item.storageName].push(item);
  });

  // 🔥 render
  for (const storage in grouped) {

    const div = document.createElement("div");

    let html = `<h3>${storage}</h3>`;

    grouped[storage].forEach(slot => {
      html += `
        <div>
          → Shelf ${slot.slotName} 
          (${slot.batteryCount} pcs, ${slot.utilization}%)
        </div>
      `;
    });

    div.innerHTML = html;
    container.appendChild(div);
  }
}

/* =========================
   NAVIGATION
========================= */
function showPage(page) {

  document.getElementById("mainPage").style.display = "none";
  document.getElementById("storagePage").style.display = "none";
  document.getElementById("processingPage").style.display = "none";
  document.getElementById("dashboardPage").style.display = "none";
  document.getElementById("adminPage").style.display = "none";

  document.getElementById(page + "Page").style.display = "block";
}

</script>

</body>
</html>
