<!DOCTYPE html>
<html>
<head>
  <title>Battery System</title>
</head>

<body>

  <h1>Battery Dashboard</h1>

  <!-- NAVIGATION -->
  <div style="margin-bottom:20px">
    <button onclick="showPage('main')">Main</button>
    <button onclick="showPage('storage')">Storage</button>
    <button onclick="showPage('processing')">Processing</button>
    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('admin')">Admin</button>
  </div>

  <!-- MAIN -->
  <div id="mainPage">
    <h2>Main</h2>
    <p>Welcome to Battery System</p>
  </div>

  <!-- STORAGE -->
  <div id="storagePage" style="display:none">
    <h2>Storage</h2>

    <h3>Add batteries to storage optimization</h3>

    <input id="barcode" placeholder="Barcode" />

    <select id="batteryType">
      <option value="1">NMC Pack</option>
      <option value="2">NMC Pack 2</option>
      <option value="3">NMC Module</option>
      <option value="4">LFP Pack</option>
      <option value="5">LFP Pack 2</option>
      <option value="6">LFP Module</option>
    </select>

    <select id="classification">
      <option value="STABLE">STABLE</option>
      <option value="CRITICAL">CRITICAL</option>
    </select>

    <button onclick="addBattery()">Add to queue</button>

    <ul id="batteryList"></ul>

    <!-- 🔥 MUUTETTU -->
    <button onclick="bulkInsert()">Bulk</button>
    <button onclick="optimize()">Optimize Storage</button>

    <!-- 🔥 UUSI TAULUKKO -->
    <h3>Inserted Batteries</h3>
    <table border="1" id="insertedTable">
      <thead>
        <tr>
          <th>Barcode</th>
          <th>Type</th>
          <th>Chemistry</th>
          <th>Classification</th>
          <th>Storage</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <hr>

    <button onclick="load()">Refresh</button>

    <table border="1" id="table" style="margin-top:20px">
      <thead>
        <tr>
          <th>Storage</th>
          <th>Chemistry</th>
          <th>Weight</th>
          <th>Count</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- PROCESSING -->
  <div id="processingPage" style="display:none">
    <h2>Processing</h2>

    <button onclick="optimizeProcessing()">Optimize Processing</button>
    <button onclick="confirmProcessing()">Confirm Processing</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardPage" style="display:none">
    <h2>Dashboard</h2>

    <h3>Worker Summary</h3>
    <table border="1" id="workers">
      <tbody></tbody>
    </table>

    <h3>Device Summary</h3>
    <table border="1" id="devices">
      <tbody></tbody>
    </table>
  </div>

  <!-- ADMIN -->
  <div id="adminPage" style="display:none">
    <h2>Admin</h2>
    <button>Add battery type</button>
    <button>Add storage</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
